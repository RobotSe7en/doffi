  <title id="title">Doffi horizontal logo — full color, transparent</title>
  <desc id="desc">Native editable vector paths reconstructed from the approved Doffi artwork. The D counter and separation channel are transparent negative space. Upright offi; two lowercase f crossbars connected. No embedded raster images or font dependencies. Colors standardized in sRGB; SVG gradients are the authoritative specifications.</desc>
